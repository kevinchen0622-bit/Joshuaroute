<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>約書亞記 — 鉛筆素描地圖</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Noto+Serif+TC:wght@300;400;700&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: radial-gradient(ellipse at center, #d8c89a 0%, #b8a870 55%, #98885a 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 6px 44px;
  min-height: 100vh;
}
.wrap {
  width: min(1060px, 99vw);
  box-shadow:
    0 0 0 1px #9a8040,
    3px 3px 0 #c0a048,
    7px 7px 0 #a88838,
    12px 12px 35px rgba(0,0,0,0.55);
  border-radius: 1px;
}
.wrap svg { width:100%; height:auto; display:block; }
.note {
  margin-top:14px;
  color:#8a7040;
  font-size:0.7rem;
  font-family:'Caveat', cursive;
  text-align:center;
  letter-spacing:0.08em;
  text-shadow: 0 1px 2px rgba(0,0,0,0.3);
}
</style>
</head>
<body>
<div class="wrap">
<!--
  COORDINATE SYSTEM  viewBox="0 0 1100 1040"
  Wide canvas = room for labels on both sides

  KEY GEOGRAPHY (approx):
    Coast (Med)    x ≈ 0–230
    Hill country   x ≈ 280–520
    Jordan River   x ≈ 640–660, y 100→590
    Transjordan    x ≈ 670–900
    Dead Sea right edge x ≈ 820

    Galilee Sea    cx=672 cy=90
    Dead Sea       cx=770 cy=640

    North          y ≈ 0–200
    Central        y ≈ 200–500
    South/Negev    y ≈ 700–1040

  CITIES:
    Shittim        820  390
    Gilgal         660  400  ← WEST bank, NW of Jericho
    Jericho        648  430
    Bethel         415  295
    Ai             458  310  (?)
    Gibeon         385  388
    Jerusalem      458  465
    Shiloh         498  262
    LowerBH        335  345
    UpperBH        362  380
    Aijalon        305  415
    Makkedah       275  452  (?)
    Azekah         292  498
    Libnah         322  535  (?)
    Lachish        295  578
    Eglon          258  622  (?)
    Hebron         455  575
    Debir          415  635  (?)
    Beersheba      382  745
    KadeshBarnea   360  848

    Merom          415  175
    Hazor          452  142
    Misrephoth     228  130
    MizpehV        515  138
-->
<svg viewBox="0 0 1100 1040" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- Rich aged paper texture -->
  <filter id="paper" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.58" numOctaves="5" seed="42" result="n1"/>
    <feColorMatrix type="saturate" values="0.2" in="n1" result="n2"/>
    <feBlend in="SourceGraphic" in2="n2" mode="multiply" result="b1"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.28" numOctaves="3" seed="7" result="n3"/>
    <feColorMatrix type="saturate" values="0" in="n3" result="n4"/>
    <feBlend in="b1" in2="n4" mode="overlay" result="b2"/>
    <feComponentTransfer in="b2">
      <feFuncR type="linear" slope="0.95" intercept="0.03"/>
      <feFuncG type="linear" slope="0.92" intercept="0.02"/>
      <feFuncB type="linear" slope="0.85" intercept="0.01"/>
    </feComponentTransfer>
  </filter>

  <!-- Watercolor wash effect for land regions -->
  <filter id="watercolor" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018 0.025" numOctaves="4" seed="19" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
    <feGaussianBlur in="displaced" stdDeviation="2.5" result="blurred"/>
    <feBlend in="SourceGraphic" in2="blurred" mode="multiply" result="blend"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="3" seed="31" result="tex"/>
    <feColorMatrix type="saturate" values="0.15" in="tex" result="tex2"/>
    <feBlend in="blend" in2="tex2" mode="multiply"/>
  </filter>

  <!-- Pencil wobble for region outlines -->
  <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="turbulence" baseFrequency="0.028 0.048" numOctaves="3" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <!-- Pencil wobble for route lines -->
  <filter id="wobble2" x="-8%" y="-8%" width="116%" height="116%">
    <feTurbulence type="turbulence" baseFrequency="0.022 0.065" numOctaves="2" seed="11" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <!-- Very light wobble for text -->
  <filter id="wobble-text">
    <feTurbulence type="turbulence" baseFrequency="0.035" numOctaves="1" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.0" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <!-- Drop shadow for boxes -->
  <filter id="box-shadow">
    <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="rgba(40,25,5,0.35)"/>
  </filter>
  <!-- Glow for route lines -->
  <filter id="line-glow-g">
    <feGaussianBlur stdDeviation="2.5" result="blur"/>
    <feFlood flood-color="#3a8a1a" flood-opacity="0.4" result="c"/>
    <feComposite in="c" in2="blur" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="line-glow-r">
    <feGaussianBlur stdDeviation="2.5" result="blur"/>
    <feFlood flood-color="#9a1a08" flood-opacity="0.4" result="c"/>
    <feComposite in="c" in2="blur" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="line-glow-b">
    <feGaussianBlur stdDeviation="2.5" result="blur"/>
    <feFlood flood-color="#1a3a9a" flood-opacity="0.35" result="c"/>
    <feComposite in="c" in2="blur" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <!-- Hatching patterns (hand-drawn feel) -->
  <pattern id="h-light" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(22)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="#9a8a5a" stroke-width="0.6" opacity="0.48"/>
  </pattern>
  <pattern id="h-med" x="0" y="0" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
    <line x1="0" y1="0" x2="0" y2="5" stroke="#8a7a4a" stroke-width="0.8" opacity="0.55"/>
  </pattern>
  <pattern id="h-cross" x="0" y="0" width="7" height="7" patternUnits="userSpaceOnUse">
    <line x1="0" y1="0" x2="7" y2="7" stroke="#7a6a3a" stroke-width="0.75" opacity="0.55"/>
    <line x1="7" y1="0" x2="0" y2="7" stroke="#7a6a3a" stroke-width="0.75" opacity="0.55"/>
  </pattern>
  <pattern id="h-east" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(14)">
    <line x1="0" y1="0" x2="0" y2="8" stroke="#aa9860" stroke-width="0.55" opacity="0.42"/>
  </pattern>

  <!-- Watercolor fills for tribes -->
  <linearGradient id="wc-north" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#b8d898" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#98c078" stop-opacity="0.45"/>
  </linearGradient>
  <linearGradient id="wc-central" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#a8d088" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#88b868" stop-opacity="0.4"/>
  </linearGradient>
  <linearGradient id="wc-judah" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0%" stop-color="#90c070" stop-opacity="0.6"/>
    <stop offset="60%" stop-color="#78a858" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#608840" stop-opacity="0.4"/>
  </linearGradient>
  <linearGradient id="wc-east" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#d8b878" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#c0a060" stop-opacity="0.4"/>
  </linearGradient>

  <!-- Arrow markers (hand-drawn, slightly irregular) -->
  <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0.5 0.5 Q4 2 9 5 Q4 8 0.5 9.5 L2.5 5 Z" fill="#1a5a10" stroke="#1a5a10" stroke-width="0.3"/>
  </marker>
  <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0.5 0.5 Q4 2 9 5 Q4 8 0.5 9.5 L2.5 5 Z" fill="#7a1208" stroke="#7a1208" stroke-width="0.3"/>
  </marker>
  <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0.5 0.5 Q4 2 9 5 Q4 8 0.5 9.5 L2.5 5 Z" fill="#1a3888" stroke="#1a3888" stroke-width="0.3"/>
  </marker>
  <marker id="ab2" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto">
    <path d="M0.5 0.5 Q3 2 6.5 3.5 Q3 5 0.5 6.5 L2 3.5 Z" fill="#1a3888" stroke="#1a3888" stroke-width="0.3"/>
  </marker>
  <marker id="ar2" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto">
    <path d="M0.5 0.5 Q3 2 6.5 3.5 Q3 5 0.5 6.5 L2 3.5 Z" fill="#7a1208" stroke="#7a1208" stroke-width="0.3"/>
  </marker>
</defs>

<!-- ════════════════════════════════════ -->
