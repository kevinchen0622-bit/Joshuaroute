<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>約書亞記 10–15 互動教學地圖</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+TC:wght@300;400;500;700&display=swap');

:root {
  --gold: #d4a830;
  --gold-dim: #8a6820;
  --bg: #0d0906;
  --panel: rgba(8,5,2,0.92);
  --green: #22cc44;
  --red: #ee3322;
  --blue: #2288ee;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  font-family: 'Noto Serif TC', serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 10px 4px 24px;
  user-select: none;
}

/* ── TOP HEADER ── */
.header {
  width: min(820px, 100vw);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 12px;
  margin-bottom: 8px;
}
.title-block h1 {
  font-family: 'Cinzel', serif;
  color: var(--gold);
  font-size: clamp(0.85rem, 2.5vw, 1.2rem);
  letter-spacing: 0.12em;
  text-shadow: 0 0 18px rgba(212,168,48,0.45);
}
.title-block p {
  color: #6a5030;
  font-size: 0.62rem;
  letter-spacing: 0.08em;
  margin-top: 2px;
}

/* ── CONTROL TOOLBAR ── */
.toolbar {
  width: min(820px, 100vw);
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 8px 10px;
  background: rgba(20,12,4,0.95);
  border: 1px solid rgba(212,168,48,0.2);
  border-radius: 8px;
  margin-bottom: 8px;
}

.toolbar-section {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}
.toolbar-label {
  font-size: 0.58rem;
  color: var(--gold-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  white-space: nowrap;
}

.btn-group { display: flex; gap: 4px; flex-wrap: wrap; }

button {
  font-family: 'Noto Serif TC', serif;
  font-size: 0.72rem;
  padding: 5px 10px;
  border: 1px solid rgba(212,168,48,0.3);
  border-radius: 4px;
  background: rgba(30,18,6,0.9);
  color: #c8a848;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
button:hover { background: rgba(212,168,48,0.15); border-color: var(--gold); color: var(--gold); }
button.active {
  background: rgba(212,168,48,0.22);
  border-color: var(--gold);
  color: var(--gold);
  font-weight: bold;
}
button.btn-green { border-color: rgba(34,204,68,0.4); color: #66dd88; }
button.btn-green:hover, button.btn-green.active { background: rgba(34,204,68,0.18); border-color: var(--green); color: var(--green); }
button.btn-red { border-color: rgba(238,51,34,0.4); color: #ee8878; }
button.btn-red:hover, button.btn-red.active { background: rgba(238,51,34,0.18); border-color: var(--red); color: var(--red); }
button.btn-blue { border-color: rgba(34,136,238,0.4); color: #88bbee; }
button.btn-blue:hover, button.btn-blue.active { background: rgba(34,136,238,0.18); border-color: var(--blue); color: var(--blue); }

.divider { width: 1px; background: rgba(212,168,48,0.15); margin: 0 4px; align-self: stretch; }

/* ── LESSON PANEL ── */
.lesson-bar {
  width: min(820px, 100vw);
  background: rgba(12,8,2,0.96);
  border: 1px solid rgba(212,168,48,0.25);
  border-radius: 8px;
  padding: 10px 14px;
  margin-bottom: 8px;
  display: none;
}
.lesson-bar.visible { display: block; }

.lesson-nav {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.lesson-title {
  font-family: 'Cinzel', serif;
  color: var(--gold);
  font-size: 0.9rem;
  letter-spacing: 0.08em;
  flex: 1;
  text-align: center;
}
.lesson-dots {
  display: flex;
  gap: 5px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 6px;
}
.lesson-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: rgba(212,168,48,0.2);
  border: 1px solid rgba(212,168,48,0.3);
  cursor: pointer;
  transition: all 0.15s;
}
.lesson-dot.active { background: var(--gold); border-color: var(--gold); transform: scale(1.3); }
.lesson-dot.done { background: rgba(212,168,48,0.5); }

.lesson-text {
  color: #d8b870;
  font-size: 0.8rem;
  line-height: 1.7;
  text-align: center;
  min-height: 40px;
}
.lesson-text strong { color: var(--gold); }
.lesson-text .verse { color: #8a7050; font-size: 0.7rem; margin-top: 4px; display: block; }

/* ── MAP WRAPPER ── */
.map-wrap {
  width: min(820px, 100vw);
  position: relative;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 8px 40px rgba(0,0,0,0.8);
}

/* Layers stacked via absolute positioning */
.map-layer {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  transition: opacity 0.4s ease;
}
.map-layer svg { width: 100%; height: 100%; }

/* The base SVG defines the height */
.map-base { position: relative; }
.map-base svg { width: 100%; height: auto; display: block; }

/* Opacity controls */
#layer-tribes { opacity: 0; pointer-events: none; }
#layer-conquest { opacity: 1; }
#layer-north { opacity: 0; }

/* ── OPACITY SLIDER ── */
.opacity-row {
  display: flex; align-items: center; gap: 8px;
}
.opacity-row label { font-size: 0.65rem; color: #8a6830; white-space: nowrap; }
input[type=range] {
  width: 80px;
  accent-color: var(--gold);
}

/* ── STEP HIGHLIGHT ── */
.step-highlight { transition: opacity 0.3s; }

/* ── FULLSCREEN ── */
.fs-btn {
  position: absolute;
  top: 8px; right: 8px;
  background: rgba(0,0,0,0.6);
  border: 1px solid rgba(212,168,48,0.3);
  color: var(--gold);
  font-size: 0.7rem;
  padding: 3px 7px;
  border-radius: 3px;
  cursor: pointer;
  z-index: 10;
}

/* ── FULLSCREEN CONTAINER ── */
#fs-container {
  width: min(820px, 100vw);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
#fs-container .toolbar,
#fs-container .lesson-bar {
  width: 100%;
}
/* When actually fullscreen, fill viewport */
#fs-container:fullscreen,
#fs-container:-webkit-full-screen {
  width: 100vw;
  height: 100vh;
  background: var(--bg);
  overflow-y: auto;
  padding: 8px;
  box-sizing: border-box;
}
#fs-container:fullscreen .map-wrap,
#fs-container:-webkit-full-screen .map-wrap {
  width: 100%;
  flex: 1;
}
#fs-container:fullscreen .toolbar,
#fs-container:-webkit-full-screen .toolbar {
  width: 100%;
}
#fs-container:fullscreen .lesson-bar,
#fs-container:-webkit-full-screen .lesson-bar {
  width: 100%;
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="title-block">
    <h1>約書亞記 10–15 章 互動教學地圖</h1>
    <p>征服路線 × 支派分地 · 可分段切換 · 適合課堂教學</p>
  </div>
</div>

<!-- FULLSCREEN WRAPPER (contains toolbar + lesson + map) -->
<div id="fs-container">

<!-- TOOLBAR -->
<div class="toolbar">

  <!-- Layer controls -->
  <div class="toolbar-section">
    <div class="toolbar-label">地圖圖層</div>
    <div class="btn-group">
      <button class="btn-green active" id="btn-conquest" onclick="toggleLayer('conquest')">🗡 征服路線</button>
      <button class="btn-blue" id="btn-north" onclick="toggleLayer('north')">⬆ 北方戰役</button>
      <button id="btn-tribes" onclick="toggleLayer('tribes')">🏕 支派分地</button>
    </div>
  </div>

  <div class="divider"></div>

  <!-- Tribe opacity -->
  <div class="toolbar-section">
    <div class="toolbar-label">支派圖層透明度</div>
    <div class="opacity-row">
      <label>透明</label>
      <input type="range" id="tribe-opacity" min="0" max="100" value="0" oninput="setTribesOpacity(this.value)">
      <label>不透明</label>
    </div>
  </div>

  <div class="divider"></div>

  <!-- Lesson mode -->
  <div class="toolbar-section">
    <div class="toolbar-label">分段教學模式</div>
    <div class="btn-group">
      <button class="btn-green" onclick="startLesson('central')">📖 中路戰役</button>
      <button class="btn-red" onclick="startLesson('south')">📖 南路戰役</button>
      <button class="btn-blue" onclick="startLesson('north')">📖 北方戰役</button>
      <button onclick="startLesson('tribes')">📖 支派分地</button>
      <button onclick="exitLesson()" style="border-color:rgba(180,60,60,0.4);color:#cc8888">✕ 結束</button>
    </div>
  </div>

</div>

<!-- LESSON PANEL -->
<div class="lesson-bar" id="lesson-bar">
  <div class="lesson-nav">
    <button onclick="lessonStep(-1)" style="padding:4px 12px">◀</button>
    <div class="lesson-title" id="lesson-title">教學模式</div>
    <button onclick="lessonStep(1)" style="padding:4px 12px">▶</button>
  </div>
  <div class="lesson-text" id="lesson-text"></div>
  <div class="lesson-dots" id="lesson-dots"></div>
</div>

<!-- MAP STACK -->

<script>
// ─── LAYER STATE ───
const layers = { conquest: true, tribes: false, north: false };

function toggleLayer(name) {
  layers[name] = !layers[name];
  const el = document.getElementById('layer-' + name);
  const btn = document.getElementById('btn-' + name);
  if (layers[name]) {
    el.style.opacity = name === 'tribes' ? (document.getElementById('tribe-opacity').value / 100) : '1';
    el.style.pointerEvents = 'none';
    btn.classList.add('active');
  } else {
    el.style.opacity = '0';
    btn.classList.remove('active');
    // also reset slider if turning off tribes
    if (name === 'tribes') document.getElementById('tribe-opacity').value = 0;
  }
}

function setTribesOpacity(val) {
  const el = document.getElementById('layer-tribes');
  const op = val / 100;
  el.style.opacity = op;
  el.style.pointerEvents = 'none';
  layers.tribes = op > 0;
  document.getElementById('btn-tribes').classList.toggle('active', op > 0);
}

      { label: '步驟②攻取耶利哥', text: '全軍<strong>繞城七日</strong>，第七日吹號呼喊，<strong>城牆倒塌</strong>。喇合全家蒙保護。耶利哥被焚毀，財物歸耶和華庫中。<span class="verse">書6章</span>', show: ['g-central'], highlight: [2] },

      { label: '步驟④基遍人詐和', text: '<strong>基遍人（希未人）</strong>假冒遠方人，騙取以色列立約。約書亞未求問神就立約，後發現真相卻不能毀約，使基遍人成為劈柴挑水的人。<span class="verse">書9章</span>', show: ['g-central'], highlight: [4] },

      { label: '步驟⑦上伯和崙山道', text: '聯軍沿<strong>伯和崙上坡</strong>逃往沿海平原方向。這是耶路撒冷山地下降地中海沿岸的最重要山口，海拔落差達600公尺，是古代的戰略要道。<span class="verse">書10:10</span>', show: ['g-south'], highlight: [7] },

      { label: '步驟⑪攻取立拿', text: '<strong>立拿（Libnah）</strong>陷落。確切位置仍有爭議，學者多認為在拉吉附近。約書亞繼續揮軍南下，形成「滾雪球」式的連續征服。<span class="verse">書10:29-30</span>', show: ['g-south'], highlight: [11] },
      { label: '步驟⑫攻取拉吉', text: '<strong>拉吉（Lachish）</strong>是南方最重要的城市之一，位於扼守前往別是巴道路的要衝。後來在希西家王時代成為亞述人攻擊猶大的主要目標（賽36章）。<span class="verse">書10:31-32</span>', show: ['g-south'], highlight: [12] },

let currentLesson = null;
let currentStep = 0;

function startLesson(name) {
  currentLesson = name;
  currentStep = 0;

  // Setup layers for lesson
  if (name === 'central' || name === 'south') {
    if (!layers.conquest) toggleLayer('conquest');
    if (layers.north) toggleLayer('north');
    if (layers.tribes) { layers.tribes = false; document.getElementById('layer-tribes').style.opacity = 0; document.getElementById('btn-tribes').classList.remove('active'); }
  } else if (name === 'north') {
    if (layers.conquest) toggleLayer('conquest');
    if (!layers.north) toggleLayer('north');
    if (layers.tribes) { layers.tribes = false; document.getElementById('layer-tribes').style.opacity = 0; document.getElementById('btn-tribes').classList.remove('active'); }
  } else if (name === 'tribes') {
    if (layers.conquest) toggleLayer('conquest');
    if (layers.north) toggleLayer('north');
    document.getElementById('layer-tribes').style.opacity = '0.78';
    document.getElementById('tribe-opacity').value = 78;
    layers.tribes = true;
    document.getElementById('btn-tribes').classList.add('active');
  }

  document.getElementById('lesson-bar').classList.add('visible');
  renderLesson();
}

function exitLesson() {
  currentLesson = null;
  document.getElementById('lesson-bar').classList.remove('visible');
  // restore all opacity
  restoreHighlight();
}

function lessonStep(dir) {
  if (!currentLesson) return;
  const ls = lessons[currentLesson];
  currentStep = Math.max(0, Math.min(ls.steps.length - 1, currentStep + dir));
  renderLesson();
}

function renderLesson() {
  const ls = lessons[currentLesson];
  const step = ls.steps[currentStep];

  document.getElementById('lesson-title').textContent = ls.title + `  (${currentStep+1}/${ls.steps.length})`;
  document.getElementById('lesson-text').innerHTML = `<strong style="color:${ls.color}">${step.label}</strong><br>${step.text}`;

  // Dots
  const dotsEl = document.getElementById('lesson-dots');
  dotsEl.innerHTML = '';
  ls.steps.forEach((s, i) => {
    const d = document.createElement('div');
    d.className = 'lesson-dot' + (i === currentStep ? ' active' : (i < currentStep ? ' done' : ''));
    d.onclick = () => { currentStep = i; renderLesson(); };
    dotsEl.appendChild(d);
  });

  // Layer visibility for this step
  const step_data = ls.steps[currentStep];
  applyStepHighlight(step_data);
}

function applyStepHighlight(step_data) {
  // For tribes lesson: highlight specific tribe paths
  if (currentLesson === 'tribes') {
    // Reset all tribes opacity
    document.querySelectorAll('#layer-tribes path[id^="t-"]').forEach(p => {
      p.style.opacity = '0.35';
    });
    if (step_data.highlight && step_data.highlight.length) {
      step_data.highlight.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.opacity = '0.88';
      });
    } else {
      // Show all if no specific highlight
      document.querySelectorAll('#layer-tribes path[id^="t-"]').forEach(p => {
        p.style.opacity = '0.78';
      });
    }
    return;
  }

  // For conquest lessons: highlight step badges
  // Dim everything first
  document.querySelectorAll('#layer-conquest circle, #layer-conquest path.step-g, #layer-conquest path.step-r').forEach(el => {
    el.style.opacity = '0.18';
  });
  document.querySelectorAll('#layer-north circle, #layer-north path').forEach(el => {
    el.style.opacity = '0.18';
  });

  if (!step_data.highlight || step_data.highlight.length === 0) {
    // Show all
    restoreHighlight();
    return;
  }

  // Highlight current step number elements
  step_data.highlight.forEach(num => {
    // Highlight badge circles and paths with matching step class
    document.querySelectorAll(`#layer-conquest .step-${num}, #layer-north .step-${num}`).forEach(el => {
      el.style.opacity = '1';
    });
    // Also brighten the corresponding badge
    document.querySelectorAll(`#layer-conquest circle, #layer-north circle`).forEach(c => {
      if (c.nextElementSibling && c.nextElementSibling.textContent == num) {
        c.style.opacity = '1';
        c.nextElementSibling.style.opacity = '1';
      }
    });
  });

  // Always show city dots
  document.querySelectorAll('#layer-conquest circle[r="7"], #layer-conquest circle[r="6"], #layer-conquest circle[r="9"], #layer-conquest circle[r="10"]').forEach(c => {
    c.style.opacity = '0.7';
  });
}

function restoreHighlight() {
  document.querySelectorAll('#layer-conquest *, #layer-north *, #layer-tribes path[id^="t-"]').forEach(el => {
    el.style.opacity = '';
  });
}

// ─── FULLSCREEN ───
function toggleFS() {
  const el = document.getElementById('fs-container');
  if (!document.fullscreenElement) {
    (el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen).call(el);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen).call(document);
  }
}

// ─── KEYBOARD NAV ───
document.addEventListener('keydown', e => {
  if (!currentLesson) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') lessonStep(1);
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') lessonStep(-1);
  if (e.key === 'Escape') exitLesson();
});

// Init: show conquest layer active
document.getElementById('layer-tribes').style.opacity = '0';
document.getElementById('layer-north').style.opacity = '0';
</script>
